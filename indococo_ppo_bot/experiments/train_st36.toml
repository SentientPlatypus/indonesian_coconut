# ST36 = BEST ST25's recipe (train_st25.toml: setters, PPO 1 epoch, policy
# bf16 off, ENT 0.016, gamma 0.998, CHUNK 100M, the ST25 league) with ONE
# change: reward_config -> st36.toml (shadow_box weight 30, PBRS, not
# zero-sum). Used when ST35 does not promote (start ST25). PFSP is OFF
# (a single lever). Galactus stays at ~25.8% via the ST25 mix
# (OPPCH 0.70, GAL_WEIGHT 6.429 of league total 17.427).
# See EXPERIMENTS.md ST36.
reward_config = "@RUN@/cfg/experiments/st36.toml"
checkpoints = "@RUN@/checkpoints"
backend = "torch"
threads = 24
pools = 2
games = 512
timesteps_per_iteration = @TPI@
mini_batch_size = @MB@
epochs = 1
policy_lr = @LR@
critic_lr = @LR@
entropy = @ENT@
gamma = @GAMMA@
lambda = 0.95
policy_bf16 = false
critic_bf16 = true
save_every = 50_000_000
keep_checkpoints = 40
iterations = @ITERATIONS@
critic_warmup_steps = @WARM@
self_play_old_versions = true
skill_tracker = false

[lr_schedule]
kind = "cosine"
hold_steps = @HOLD@
decay_steps = @DECAY@
min_scale = @MINLR@

# League: past bests as fixed opponents (scaled 0.816). ST20r@2.0 is added
# via EXTRA_OPPS in st_ST25.env, not here.
[opponents]
chance = @OPPCH@
past_versions_weight = 0.816
[[opponents.fixed]]
name = "FR4_final"
checkpoint = "@RUN@/opponents/FR4_final"
weight = 0.816

# ST25 setter mix: normal play x0.875 (kickoff 0.315, random 0.105+0.105,
# replay 0.175), aerial_defense 0.15 (unchanged), demo_threat 0.15 with the
# attacker starting 1800-3000 uu away (diag_gal ST23). Sum 1.0.
# No air_dribble_wall_challenge.
[[state_setters]]
kind = "kickoff"
weight = 0.315
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
car_speed = true
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
cars_on_ground = true
[[state_setters]]
kind = "replay"
weight = 0.175
path = "@SNAP@"
[[state_setters]]
kind = "aerial_defense"
weight = 0.15
[[state_setters]]
kind = "demo_threat"
weight = 0.15
distance = [1800.0, 3000.0]

# ST25 (same as ST24): Rust Ripple v1.1 (9d4b2a6 binary, LibTorch CUDA; RIPPLE_DEVICE=cuda)
# at ~5.2% of iterations (0.7*1.286/17.427) because OPPCH is 0.70 and
# ST20r@2.0 was added to the league.
[[opponents.external]]
name = "ripple"
kind = "ripple"
path = "/home/ubuntu/eval_bots/ripple/bots/v1.1"
weight = 1.286
