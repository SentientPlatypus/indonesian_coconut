# ST learner settings (EXPERIMENTS.md ST). Filled in by st_launch.sh from
# st_<VARIANT>.env. ST27 = ST26 (ST25 setters, no ST20r, league = ST23's)
# with ONE change: FR4_final's fixed league weight 0.816 -> 2.0.
# Evidence: FR4 is the only gate metric ST25 missed (78.4 vs ST23 79.6), and
# ST24 (which diluted the league with ST20r@2.0) dropped FR4 to 77.0. A
# 200-game per-goal diagnostic vs FR4 (diag_gal/diag_fr4.py, 2026-11-11)
# shows FR4 beats us in ways no setter reproduces: we lose 44% of kickoffs to
# FR4 (88/200; vs Galactus we lose 15%) and win 70.5% after a lost kickoff vs
# 83.3% after a won one; 61% of goals conceded to FR4 are aerials (z>300) or
# out-of-position ground goals, at a median shot height of 405 uu. At OPPCH
# 0.70 the realized FR4 share goes 3.7% -> 8.4% of iterations (total league
# weight 15.427 -> 16.611); Galactus 29.2% -> 27.1%, Megabyte 9.1% -> 8.4%,
# Ripple 5.8% -> 5.4%, self-play stays 30%. Setters unchanged.
# Measured vs BEST at launch (st25_final, promoted 2026-11-11).
reward_config = "@RUN@/cfg/experiments/st.toml"
checkpoints = "@RUN@/checkpoints"
backend = "torch"
threads = 24
pools = 2
games = 512
timesteps_per_iteration = @TPI@
mini_batch_size = @MB@
epochs = 1
policy_lr = @LR@
critic_lr = @LR@
entropy = @ENT@
gamma = @GAMMA@
lambda = 0.95
policy_bf16 = false
critic_bf16 = true
save_every = 50_000_000
keep_checkpoints = 40
iterations = @ITERATIONS@
critic_warmup_steps = @WARM@
self_play_old_versions = true
skill_tracker = false

[lr_schedule]
kind = "cosine"
hold_steps = @HOLD@
decay_steps = @DECAY@
min_scale = @MINLR@

# League: past bests as fixed opponents (scaled 0.816). ST13-16/HUNT come
# from EXTRA_OPPS in st_ST27.env. No ST20r. ST27: FR4_final 0.816 -> 2.0.
[opponents]
chance = @OPPCH@
past_versions_weight = 0.816
[[opponents.fixed]]
name = "FR4_final"
checkpoint = "@RUN@/opponents/FR4_final"
weight = 2.0

# ST27 = ST26 = ST25 setter mix: normal play x0.875 (kickoff 0.315, random 0.105+0.105,
# replay 0.175), aerial_defense 0.15 (unchanged), demo_threat 0.15 with the
# attacker starting 1800-3000 uu away (diag_gal ST23). Sum 1.0.
# No air_dribble_wall_challenge.
[[state_setters]]
kind = "kickoff"
weight = 0.315
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
car_speed = true
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
cars_on_ground = true
[[state_setters]]
kind = "replay"
weight = 0.175
path = "@SNAP@"
[[state_setters]]
kind = "aerial_defense"
weight = 0.15
[[state_setters]]
kind = "demo_threat"
weight = 0.15
distance = [1800.0, 3000.0]

# ST27: Rust Ripple v1.1 (9d4b2a6 binary, LibTorch CUDA; RIPPLE_DEVICE=cuda)
# at ~5.4% of iterations (0.7*1.286/16.611) with FR4_final at 2.0.
[[opponents.external]]
name = "ripple"
kind = "ripple"
path = "/home/ubuntu/eval_bots/ripple/bots/v1.1"
weight = 1.286
