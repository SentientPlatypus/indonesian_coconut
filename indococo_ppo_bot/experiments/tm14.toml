# TM14 reward = GCO (goal / concede only), EXPERIMENTS.md "TM14 — Cross-exam note".
# tm13.toml plus a 500M linear anneal of every other weighted term from its
# TM13 end scale (0.3 for the 27 GCO-lite terms, 1.0 for the rest) to 0.0,
# steps relative to spirit_origin (= the TM14 start, set by the launcher).
# After 500M the only non-zero term is `goal` (weight 1200: +1 to every car of
# the scoring team, -1 to every car of the conceding team; symmetric, team-
# shared; spirit_full keeps it at tau 1.0, which is a no-op for an equal
# team value). No time penalty exists in this codebase. Terms stay built (at
# scale 0) so the [team] gates / lists that name them still validate and the
# Reward/* metrics keep reporting. Kickoff hygiene from tm13.toml is inert
# once its terms reach 0. team_best is never written.
# shortcut: zeroing via term_ramp still computes all 50 terms every step (no sps
# win); a pure-GCO config that drops them needs every [team] list pruned too.
extends = "tm13.toml"

# Every key overrides the same key from tm12/tm13 (tables merge key by key).
[team.term_ramp]
goal_prob = [[0.0, 1.0], [500_000_000.0, 0.0]]
ball_travel = [[0.0, 1.0], [500_000_000.0, 0.0]]
vel_ball_to_goal = [[0.0, 1.0], [500_000_000.0, 0.0]]
