# ST learner settings (EXPERIMENTS.md ST). Filled in by st_launch.sh from
# st_<VARIANT>.env. ST26 = ST25 with the fixed ST20r_final@2.0 league
# opponent removed (st_ST26.env EXTRA_OPPS). This file is ST25's setters and
# learner settings unchanged. ST24 showed ST20r did not recover bp5 (67.0 vs
# BEST 68.67) and cost FR4 (77.0 vs 79.6). The league is back to ST23's
# (total weight 15.427). Setter mix: demo_threat 0.15 @ [1800,3000],
# aerial_defense 0.15, normal play x0.875 (see ST25 in EXPERIMENTS.md).
# Measured vs BEST at launch (st23_final unless ST25 promotes).
reward_config = "@RUN@/cfg/experiments/st.toml"
checkpoints = "@RUN@/checkpoints"
backend = "torch"
threads = 24
pools = 2
games = 512
timesteps_per_iteration = @TPI@
mini_batch_size = @MB@
epochs = 1
policy_lr = @LR@
critic_lr = @LR@
entropy = @ENT@
gamma = @GAMMA@
lambda = 0.95
policy_bf16 = false
critic_bf16 = true
save_every = 50_000_000
keep_checkpoints = 40
iterations = @ITERATIONS@
critic_warmup_steps = @WARM@
self_play_old_versions = true
skill_tracker = false

[lr_schedule]
kind = "cosine"
hold_steps = @HOLD@
decay_steps = @DECAY@
min_scale = @MINLR@

# League: past bests as fixed opponents (scaled 0.816). ST13-16/HUNT come
# from EXTRA_OPPS in st_ST26.env. No ST20r.
[opponents]
chance = @OPPCH@
past_versions_weight = 0.816
[[opponents.fixed]]
name = "FR4_final"
checkpoint = "@RUN@/opponents/FR4_final"
weight = 0.816

# ST26 = ST25 setter mix: normal play x0.875 (kickoff 0.315, random 0.105+0.105,
# replay 0.175), aerial_defense 0.15 (unchanged), demo_threat 0.15 with the
# attacker starting 1800-3000 uu away (diag_gal ST23). Sum 1.0.
# No air_dribble_wall_challenge.
[[state_setters]]
kind = "kickoff"
weight = 0.315
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
car_speed = true
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
cars_on_ground = true
[[state_setters]]
kind = "replay"
weight = 0.175
path = "@SNAP@"
[[state_setters]]
kind = "aerial_defense"
weight = 0.15
[[state_setters]]
kind = "demo_threat"
weight = 0.15
distance = [1800.0, 3000.0]

# ST26: Rust Ripple v1.1 (9d4b2a6 binary, LibTorch CUDA; RIPPLE_DEVICE=cuda)
# at ~5.8% of iterations (0.7*1.286/15.427), as in ST23, now that ST20r is
# out of the league.
[[opponents.external]]
name = "ripple"
kind = "ripple"
path = "/home/ubuntu/eval_bots/ripple/bots/v1.1"
weight = 1.286
