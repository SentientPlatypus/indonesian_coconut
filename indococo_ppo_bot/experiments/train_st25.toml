# ST learner settings (EXPERIMENTS.md ST). Filled in by st_launch.sh from
# st_<VARIANT>.env. ST25 = ST24 (ST23 + ST20r_final@2.0 league opponent;
# OPPCH 0.70, ppo epochs 1, binary 9d4b2a6, league unchanged) plus ONE
# change: the demo_threat drill is retuned to the way Galactus beats us now.
# Evidence (diag_gal, 200 g ST23 vs Galactus, 2026-11-11): 59% of conceded
# goals (73/124) come within 3.5 s of us being demoed (ST16: 29%), aerial
# goals fell 55 -> 24 since the ST19 aerial_defense setter. 93/200 games had
# a demo on us; win rate 9.7% in those vs ~63% in the rest. Context 1 s
# before the demo: Galactus ~2.5k uu away (p25-p75 2.1k-2.9k) at ~2050 uu/s,
# we are on the ground, goal-side, ~0.5k uu from our goal line, ~93 boost.
# The ST19 drill (5% of starts, 800-1500 uu) has not moved this.
# Change: demo_threat 0.05 -> 0.15 of starts, distance [800,1500] ->
# [1800,3000]; the +0.10 comes from normal play (kickoff/random/replay
# 0.80 -> 0.70, x0.875), aerial_defense stays 0.15. Measured vs BEST at
# launch (st23_final unless ST24 promotes).
reward_config = "@RUN@/cfg/experiments/st.toml"
checkpoints = "@RUN@/checkpoints"
backend = "torch"
threads = 24
pools = 2
games = 512
timesteps_per_iteration = @TPI@
mini_batch_size = @MB@
epochs = 1
policy_lr = @LR@
critic_lr = @LR@
entropy = @ENT@
gamma = @GAMMA@
lambda = 0.95
policy_bf16 = false
critic_bf16 = true
save_every = 50_000_000
keep_checkpoints = 40
iterations = @ITERATIONS@
critic_warmup_steps = @WARM@
self_play_old_versions = true
skill_tracker = false

[lr_schedule]
kind = "cosine"
hold_steps = @HOLD@
decay_steps = @DECAY@
min_scale = @MINLR@

# League: past bests as fixed opponents (scaled 0.816). ST20r@2.0 is added
# via EXTRA_OPPS in st_ST25.env, not here.
[opponents]
chance = @OPPCH@
past_versions_weight = 0.816
[[opponents.fixed]]
name = "FR4_final"
checkpoint = "@RUN@/opponents/FR4_final"
weight = 0.816

# ST25 setter mix: normal play x0.875 (kickoff 0.315, random 0.105+0.105,
# replay 0.175), aerial_defense 0.15 (unchanged), demo_threat 0.15 with the
# attacker starting 1800-3000 uu away (diag_gal ST23). Sum 1.0.
# No air_dribble_wall_challenge.
[[state_setters]]
kind = "kickoff"
weight = 0.315
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
car_speed = true
[[state_setters]]
kind = "random"
weight = 0.105
ball_speed = true
cars_on_ground = true
[[state_setters]]
kind = "replay"
weight = 0.175
path = "@SNAP@"
[[state_setters]]
kind = "aerial_defense"
weight = 0.15
[[state_setters]]
kind = "demo_threat"
weight = 0.15
distance = [1800.0, 3000.0]

# ST25 (same as ST24): Rust Ripple v1.1 (9d4b2a6 binary, LibTorch CUDA; RIPPLE_DEVICE=cuda)
# at ~5.2% of iterations (0.7*1.286/17.427) because OPPCH is 0.70 and
# ST20r@2.0 was added to the league.
[[opponents.external]]
name = "ripple"
kind = "ripple"
path = "/home/ubuntu/eval_bots/ripple/bots/v1.1"
weight = 1.286
