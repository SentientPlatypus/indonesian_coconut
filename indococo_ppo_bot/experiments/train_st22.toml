# ST learner settings (EXPERIMENTS.md ST). Filled in by st_launch.sh from
# st_<VARIANT>.env. ST22 = ST21 + OPPCH 0.70 (one change; chance = @OPPCH@ is
# filled from st_ST22.env). Same gal4 setters as ST19/ST20/ST21 (normal play x0.8 +
# aerial_defense 0.15 + demo_threat 0.05) and same league weights as ST21. With
# OPPCH 0.70: Galactus 29.2% / Ripple 5.8% / Megabyte 9.1% / other league 25.9% /
# self-play 30%. Measured vs BEST at launch (ST20r unless ST21 promotes).
reward_config = "@RUN@/cfg/experiments/st.toml"
checkpoints = "@RUN@/checkpoints"
backend = "torch"
threads = 24
pools = 2
games = 512
timesteps_per_iteration = @TPI@
mini_batch_size = @MB@
epochs = 2
policy_lr = @LR@
critic_lr = @LR@
entropy = @ENT@
gamma = @GAMMA@
lambda = 0.95
policy_bf16 = false
critic_bf16 = true
save_every = 50_000_000
keep_checkpoints = 40
iterations = @ITERATIONS@
critic_warmup_steps = @WARM@
self_play_old_versions = true
skill_tracker = false

[lr_schedule]
kind = "cosine"
hold_steps = @HOLD@
decay_steps = @DECAY@
min_scale = @MINLR@

# League: past bests as fixed opponents (scaled 0.816 so Galactus can take 25%).
[opponents]
chance = @OPPCH@
past_versions_weight = 0.816
[[opponents.fixed]]
name = "FR4_final"
checkpoint = "@RUN@/opponents/FR4_final"
weight = 0.816

[[state_setters]]
kind = "kickoff"
weight = 0.36
[[state_setters]]
kind = "random"
weight = 0.12
ball_speed = true
car_speed = true
[[state_setters]]
kind = "random"
weight = 0.12
ball_speed = true
cars_on_ground = true
[[state_setters]]
kind = "replay"
weight = 0.20
path = "@SNAP@"
[[state_setters]]
kind = "aerial_defense"
weight = 0.15
[[state_setters]]
kind = "demo_threat"
weight = 0.05

# ST22: Rust Ripple v1.1 (e429d1a, LibTorch CUDA; RIPPLE_DEVICE=cuda), same
# weight as ST21; ~5.8% of iterations (0.7*1.286/15.427) because OPPCH is 0.70.
[[opponents.external]]
name = "ripple"
kind = "ripple"
path = "/home/ubuntu/eval_bots/ripple/bots/v1.1"
weight = 1.286
