[[opponent]]
name = "necto"
kind = "necto"
path = "~/eval_bots/necto"

[[opponent]]
name = "element"
kind = "element"
path = "~/eval_bots/element"

[[opponent]]
name = "immortal"
kind = "immortal"
path = "~/eval_bots/immortal"
