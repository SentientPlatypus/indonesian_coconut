[package]
name = "indococo-bot"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0"
description = "indonesian_coconut 1v1 bot on indococo-ppo: E8B2 rewards, 1v1.pt obs/actions, RLBot deploy"
publish = false

[lib]
name = "indococo_bot"

[[bin]]
name = "indococo-train"
path = "src/bin/train.rs"
required-features = ["train"]

[[bin]]
name = "indococo-rlbot"
path = "src/bin/rlbot.rs"
required-features = ["rlbot"]

[[bin]]
name = "ripple-parity"
path = "tools/ripple_parity_rust.rs"
required-features = ["ripple"]

[[bin]]
name = "ripple-replay"
path = "tools/ripple_replay.rs"
required-features = ["ripple", "ripple-replay"]

[[bin]]
name = "ripple-idle-test"
path = "tools/ripple_idle_test.rs"
required-features = ["ripple"]

[[bin]]
name = "ripple-bench"
path = "tools/ripple_bench.rs"
required-features = ["ripple"]

[dependencies]
glam = { version = "0.34", features = ["serde"] }
rand = "0.10.1"
rlgymppo-utils = { git = "https://github.com/SentientPlatypus/indococo-ppo", rev = "22c3575aac18517089044a68a0fb8787c49b57b6" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# training
burn = { version = "0.22.0", optional = true, default-features = false, features = ["std"] }
burn-store = { version = "0.22.1", optional = true, features = ["pytorch"] }
rlgymppo = { git = "https://github.com/SentientPlatypus/indococo-ppo", rev = "22c3575aac18517089044a68a0fb8787c49b57b6", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
# Use the same tch version as burn-tch (0.22.0) to avoid links conflicts
tch = { version = "0.22.0", optional = true, default-features = false }
torch-sys = { version = "0.22.0", optional = true }
# Ripple ONNX inference  
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "half", "tls-native-vendored"] }
ndarray = { version = "0.16", optional = true }
rayon = { version = "1.12", optional = true }

# deploy
rlgymppo-model = { git = "https://github.com/SentientPlatypus/indococo-ppo", rev = "22c3575aac18517089044a68a0fb8787c49b57b6", optional = true }
rlgymppo-rlbot = { git = "https://github.com/SentientPlatypus/indococo-ppo", rev = "22c3575aac18517089044a68a0fb8787c49b57b6", optional = true }
rlbot-rocketsim = { version = "0.2.0", optional = true }
rustc-hash = { version = "2.1.1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = []
train = ["dep:rlgymppo", "dep:burn", "dep:burn-store", "dep:serde_json", "dep:rayon", "burn/autodiff", "burn/flex"]
cuda = ["train", "rlgymppo/cuda"]
fusion = ["train", "rlgymppo/fusion"]
torch = ["train", "rlgymppo/torch", "burn/tch", "dep:tch", "dep:torch-sys"]
ripple = ["train", "dep:ort", "dep:ndarray"]
ripple-replay = []  # Enables RNG override for deterministic replay (not for training)
rlbot = ["dep:burn-store", "dep:rlgymppo-model", "dep:rlgymppo-rlbot", "dep:rlbot-rocketsim", "dep:rustc-hash", "dep:burn", "burn/flex"]

[build-dependencies]
cc = "1"

[patch.crates-io]
# Same 0.3.3 sources. quantize_physics defaults on, so training arenas keep
# the registry tick. Ripple's forecast arena is the one that turns it off.
rocketsim = { path = "vendor/rocketsim" }

[patch."https://github.com/SentientPlatypus/indococo-ppo"]
# 22c3575 plus a halfway rebuild for external policies whose action_delay is 0.
rlgymppo = { path = "vendor/rlgymppo" }

[profile.release]
debug = 1

[profile.dist]
inherits = "release"
debug = false
lto = "thin"
codegen-units = 1

